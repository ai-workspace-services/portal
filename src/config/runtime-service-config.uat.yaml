# Serverless UAT 保留独立 Cloudflare / Cloud Run 入口。
# Selfhost UAT 通过部署域名选择 selfhost 覆盖，内部 BFF 只走 Compose 服务。
#
# 这个文件原先不存在, 而 loader 的 source 选择是
# `environment === 'prod' ? 'prod' : 'sit'` —— UAT 会静默使用 SIT 的端点
# (127.0.0.1:8080, 在 UAT 主机上并不存在), 同时通过 base 的漏项连着生产认证。
apiBaseUrl: https://accounts-cloudflare-uat.onwalk.net/api
authUrl: https://accounts-cloudflare-uat.onwalk.net
# The authenticated Console BFF uses the same formal Accounts edge entrance as
# the session lookup. This preserves the shared UAT session boundary while the
# edge routes the request to the GitOps-declared Accounts runtime.
xconnectZeroUrl: https://accounts-cloudflare-uat.onwalk.net
dashboardUrl: https://console.onwalk.net
docsServiceUrl: https://uat-content-service-4ueoyqlpbq-de.a.run.app
logLevel: info

selfhost:
  apiBaseUrl: https://accounts-selfhost-uat.onwalk.net/api
  authUrl: https://accounts-selfhost-uat.onwalk.net
  xconnectZeroUrl: http://accounts:8080
  dashboardUrl: https://console-selfhost-uat.onwalk.net
  docsServiceUrl: http://content:8084
