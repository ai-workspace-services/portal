# UAT。OAuth/console 入口以 GitOps 环境声明为唯一来源。
# 使用 mode-qualified serverless 主机作为唯一运行时来源；Cloudflare
# aliases 只由 GitOps/DNS 兼容，不作为 BFF 的数据源选择。
#
# 这个文件原先不存在, 而 loader 的 source 选择是
# `environment === 'prod' ? 'prod' : 'sit'` —— UAT 会静默使用 SIT 的端点
# (127.0.0.1:8080, 在 UAT 主机上并不存在), 同时通过 base 的漏项连着生产认证。
apiBaseUrl: https://accounts-serverless-uat.onwalk.net/api
authUrl: https://accounts-serverless-uat.onwalk.net
# The authenticated Console BFF uses the same formal Accounts edge entrance as
# the session lookup. This preserves the shared UAT session boundary while the
# edge routes the request to the GitOps-declared Accounts runtime.
xconnectZeroUrl: https://accounts-serverless-uat.onwalk.net
dashboardUrl: https://console-serverless-uat.onwalk.net
docsServiceUrl: https://docs.svc.plus
logLevel: info
