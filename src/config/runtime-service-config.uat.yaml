# UAT。OAuth/console 入口以 GitOps 环境声明为唯一来源:
# console-cloudflare-uat / accounts-cloudflare-uat + TARGET_DOMAIN_BASE(onwalk.net)。
#
# 这个文件原先不存在, 而 loader 的 source 选择是
# `environment === 'prod' ? 'prod' : 'sit'` —— UAT 会静默使用 SIT 的端点
# (127.0.0.1:8080, 在 UAT 主机上并不存在), 同时通过 base 的漏项连着生产认证。
apiBaseUrl: https://accounts-cloudflare-uat.onwalk.net/api
authUrl: https://accounts-cloudflare-uat.onwalk.net
# The authenticated Console BFF reaches the GitOps-declared Accounts Cloud Run
# origin directly. This avoids re-entering the public Cloudflare edge alias
# from an SSR worker while keeping browser authentication on the public host.
xconnectZeroUrl: https://uat-accounts-1004637461064.asia-northeast1.run.app
dashboardUrl: https://console-cloudflare-uat.onwalk.net
docsServiceUrl: https://docs.svc.plus
logLevel: info
