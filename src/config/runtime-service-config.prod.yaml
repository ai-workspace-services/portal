# 生产环境（prod-k3s-v6 + Fluxgate 混合架构）。
#
# 顶层必须给全端点: region 的默认值是 'default', 而下面 regions 只声明了 cn
# 与 global —— region=default 时 regions 覆盖不命中。
# K3s Pod 运行时通过 RUNTIME_*_URL 环境变量注入集群内网 Service；
# CF Worker 边缘运行时直接消费以下公网源站（其中 authUrl 走直连核心源站避免 WAF/自环）。
apiBaseUrl: https://accounts.svc.plus/api
authUrl: https://accounts-selfhost-prod-v6.svc.plus
agentServerUrl: https://accounts.svc.plus
xconnectZeroUrl: https://accounts.svc.plus
dashboardUrl: https://console.svc.plus
docsServiceUrl: https://content.svc.plus
logLevel: warn
regions:
  cn:
    apiBaseUrl: https://accounts.svc.plus/api
    authUrl: https://accounts-selfhost-prod-v6.svc.plus
    agentServerUrl: https://accounts.svc.plus
    xconnectZeroUrl: https://accounts.svc.plus
    dashboardUrl: https://console.svc.plus
    docsServiceUrl: https://content.svc.plus
  global:
    apiBaseUrl: https://accounts.svc.plus/api
    authUrl: https://accounts-selfhost-prod-v6.svc.plus
    agentServerUrl: https://accounts.svc.plus
    xconnectZeroUrl: https://accounts.svc.plus
    dashboardUrl: https://console.svc.plus
    docsServiceUrl: https://content.svc.plus
