name: Console Service Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
    tags:
      - 'prod-*'
      - 'v*'
      - '*-rebuild-*'
      - '*-release-*'
      - '*daily-build-*'
    paths:
      - ".github/workflows/ci-pipeline.yml"
      - "Dockerfile"
      - "deploy/single-node/**"
      - "package.json"
      - "yarn.lock"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "scripts/prebuild.sh"
      - "contentlayer.config.ts"
      - "next.config.js"
      - "next.config.mjs"
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options: [sit, uat, prod]
      feature_sit:
        description: Build an isolated Feature SIT image
        type: boolean
        default: false
      sit_hostname:
        description: Candidate console hostname under onwalk.net
        type: string
        required: false
      website_content_sha:
        description: Full fixed website content commit SHA
        type: string
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: console-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VAULT_ADDR: https://vault.svc.plus
  CANONICAL_DOMAIN: console.svc.plus
  SERVED_DOMAINS: console.svc.plus
  ALIAS_DOMAIN: ""
  APP_BASE_URL: https://console.svc.plus
  NEXT_PUBLIC_APP_BASE_URL: https://console.svc.plus
  NEXT_PUBLIC_SITE_URL: https://console.svc.plus
  RUNTIME_HOSTNAME: console.svc.plus
  NEXT_RUNTIME_HOSTNAME: console.svc.plus
  NEXT_PUBLIC_RUNTIME_ENVIRONMENT: prod
  NEXT_PUBLIC_RUNTIME_REGION: cn
  ACCOUNT_SERVICE_URL: https://accounts.svc.plus
  CLOUDFLARE_ZONE_TAG: bf3427f83a2c52c8285ab3d741a6ee27
  CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: 0973e84ec8872c67c570f8072e92e21b
  CLOUDFLARE_ACCOUNT_ID: e71be5efb76a6c54f78f008da4404f00
  GHCR_REGISTRY: ghcr.io
  GHCR_USERNAME: ${{ github.actor }}

jobs:
  prep:
    name: Prep
    runs-on: ubuntu-latest
    outputs:
      deployment_environment: ${{ steps.inputs.outputs.deployment_environment }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      image_ref: ${{ steps.metadata.outputs.image_ref }}
      image_latest_ref: ${{ steps.metadata.outputs.image_latest_ref }}
      ghcr_namespace: ${{ steps.metadata.outputs.ghcr_namespace }}
      push_latest: ${{ steps.push.outputs.push_latest }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check Feature SIT build isolation contract
        run: python3 -m unittest discover -s scripts/github-actions/tests -p test_feature_sit_build.py

      - name: Resolve Inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash scripts/github-actions/resolve-workflow-inputs.sh

      - name: Compute Image Metadata
        id: metadata
        env:
          FEATURE_SIT: ${{ inputs.feature_sit || false }}
        run: |
          bash scripts/github-actions/compute-frontend-release-metadata.sh

      - name: Resolve Push Latest
        id: push
        env:
          REF: ${{ github.ref }}
          FEATURE_SIT: ${{ inputs.feature_sit || false }}
        run: bash scripts/github-actions/resolve-push-latest.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prep
    env:
      NEXT_PUBLIC_RUNTIME_ENVIRONMENT: ${{ needs.prep.outputs.deployment_environment }}
      # Generic Git backend CMS configuration. These are repository variables,
      # not GitHub API integrations: any Git URL reachable by the runner works.
      WEBSITE_CONTENT_REPOSITORY: ${{ vars.WEBSITE_CONTENT_REPOSITORY || 'https://github.com/haitaopanhq/knowledge.git' }}
      WEBSITE_CONTENT_REF: ${{ vars.WEBSITE_CONTENT_REF || 'main' }}
      WEBSITE_CONTENT_SUBDIR: ${{ vars.WEBSITE_CONTENT_SUBDIR || 'content/website' }}
      REQUIRE_EXTERNAL_WEBSITE_CONTENT: "true"
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure isolated Feature SIT build
        if: ${{ inputs.feature_sit == true }}
        env:
          SIT_HOSTNAME: ${{ inputs.sit_hostname }}
          SIT_CONTENT_SHA: ${{ inputs.website_content_sha }}
          SIT_ENVIRONMENT: ${{ needs.prep.outputs.deployment_environment }}
        run: bash scripts/github-actions/configure-feature-sit-build.sh

      - name: Set Up Docker Buildx
        run: bash scripts/github-actions/setup-docker-buildx.sh

      - name: Load Vault secrets (CICD)
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: github-actions-console-${{ needs.prep.outputs.deployment_environment }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN

      - name: Log In To GHCR
        env:
          GHCR_TOKEN: ${{ steps.vault.outputs.GHCR_TOKEN }}
        run: bash scripts/github-actions/login-ghcr.sh

      - name: Publish Frontend Image
        id: publish
        env:
          IMAGE_REF: ${{ needs.prep.outputs.image_ref }}
          IMAGE_TAG: ${{ needs.prep.outputs.image_tag }}
          IMAGE_LATEST_REF: ${{ needs.prep.outputs.image_latest_ref }}
          PUSH_LATEST: ${{ needs.prep.outputs.push_latest }}
          CONTENT_RESOLVED_SHA_FILE: ${{ runner.temp }}/website-content-sha
          IMAGE_METADATA_FILE: ${{ runner.temp }}/console-image-metadata.json
        run: bash scripts/github-actions/publish-frontend-image.sh

      - name: Record immutable build provenance
        env:
          IMAGE_REF: ${{ needs.prep.outputs.image_ref }}
          CONTENT_RESOLVED_SHA_FILE: ${{ runner.temp }}/website-content-sha
          IMAGE_METADATA_FILE: ${{ runner.temp }}/console-image-metadata.json
          BUILD_PROVENANCE_FILE: ${{ runner.temp }}/console-build-provenance.json
        run: python3 scripts/github-actions/write-build-provenance.py

      - name: Retain immutable build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-build-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-build-provenance.json
          if-no-files-found: error

  release:
    name: Publish release manifest and assets
    needs: build
    if: ${{ contains(github.ref, '/tags/') && contains(github.ref, 'daily-build-') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REFS: ghcr.io/${{ github.repository_owner }}/console:${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release-artifacts.sh
