name: Console Service Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
    tags:
      - 'v*'
      - '*-rebuild-*'
      - '*-release-*'
      - '*daily-build-*'
    paths:
      - ".github/workflows/ci-pipeline.yml"
      - ".github/workflows/validate-frontend-delivery.yml"
      - ".github/scripts/**"
      - "Dockerfile*"
      - "deploy/single-node/**"
      - "deploy/nginx/**"
      - "package.json"
      - "yarn.lock"
      - "open-next.config.ts"
      - "wrangler.worker.jsonc"
      - "static-dashboard/**"
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "scripts/prebuild.sh"
      - "contentlayer.config.ts"
      - "next.config.js"
      - "next.config.mjs"
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment environment
        required: true
        default: uat
        type: choice
        options: [sit, uat, prod]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: console-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VAULT_ADDR: https://vault.svc.plus
  CANONICAL_DOMAIN: console.xworkmate.com
  SERVED_DOMAINS: console.xworkmate.com console.svc.plus
  ALIAS_DOMAIN: www.xworkmate.com
  APP_BASE_URL: https://console.xworkmate.com
  NEXT_PUBLIC_APP_BASE_URL: https://console.xworkmate.com
  NEXT_PUBLIC_SITE_URL: https://console.xworkmate.com
  RUNTIME_HOSTNAME: console.xworkmate.com
  NEXT_RUNTIME_HOSTNAME: console.xworkmate.com
  NEXT_PUBLIC_RUNTIME_ENVIRONMENT: prod
  NEXT_PUBLIC_RUNTIME_REGION: cn
  ACCOUNT_SERVICE_URL: https://accounts.svc.plus
  CLOUDFLARE_ZONE_TAG: bf3427f83a2c52c8285ab3d741a6ee27
  CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: 0973e84ec8872c67c570f8072e92e21b
  CLOUDFLARE_ACCOUNT_ID: e71be5efb76a6c54f78f008da4404f00
  GHCR_REGISTRY: ghcr.io
  GHCR_USERNAME: ${{ github.actor }}

jobs:
  prep:
    name: Prep
    runs-on: ubuntu-latest
    outputs:
      deployment_environment: ${{ steps.inputs.outputs.deployment_environment }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
      image_ref: ${{ steps.metadata.outputs.image_ref }}
      image_latest_ref: ${{ steps.metadata.outputs.image_latest_ref }}
      ghcr_namespace: ${{ steps.metadata.outputs.ghcr_namespace }}
      push_latest: ${{ steps.push.outputs.push_latest }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve Inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.deployment_environment }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash scripts/github-actions/resolve-workflow-inputs.sh

      - name: Compute Image Metadata
        id: metadata
        run: |
          bash scripts/github-actions/compute-frontend-release-metadata.sh

      - name: Resolve Push Latest
        id: push
        env:
          REF: ${{ github.ref }}
        run: bash scripts/github-actions/resolve-push-latest.sh

  build:
    name: Build / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: all-in-one
            dockerfile: Dockerfile
            image_name: console
          - target: static-dashboard
            dockerfile: Dockerfile.static-dashboard
            image_name: console-static-dashboard
          - target: frontend-server
            dockerfile: Dockerfile.frontend-server
            image_name: console-frontend-server
    env:
      NEXT_PUBLIC_RUNTIME_ENVIRONMENT: ${{ needs.prep.outputs.deployment_environment }}
      # Generic Git backend CMS configuration. These are repository variables,
      # not GitHub API integrations: any Git URL reachable by the runner works.
      WEBSITE_CONTENT_REPOSITORY: ${{ vars.WEBSITE_CONTENT_REPOSITORY || 'https://github.com/haitaopanhq/knowledge.git' }}
      WEBSITE_CONTENT_REF: ${{ vars.WEBSITE_CONTENT_REF || 'main' }}
      WEBSITE_CONTENT_SUBDIR: ${{ vars.WEBSITE_CONTENT_SUBDIR || 'content/website' }}
      REQUIRE_EXTERNAL_WEBSITE_CONTENT: "true"
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set Up Docker Buildx
        run: bash scripts/github-actions/setup-docker-buildx.sh

      - name: Load Vault secrets (CICD)
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: github-actions-console-${{ needs.prep.outputs.deployment_environment }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN

      - name: Log In To GHCR
        env:
          GHCR_TOKEN: ${{ steps.vault.outputs.GHCR_TOKEN }}
        run: bash scripts/github-actions/login-ghcr.sh

      - name: Publish Frontend Image
        id: publish
        env:
          IMAGE_REF: ghcr.io/${{ needs.prep.outputs.ghcr_namespace }}/${{ matrix.image_name }}:${{ needs.prep.outputs.image_tag }}
          IMAGE_TAG: ${{ needs.prep.outputs.image_tag }}
          IMAGE_LATEST_REF: ghcr.io/${{ needs.prep.outputs.ghcr_namespace }}/${{ matrix.image_name }}:latest
          PUSH_LATEST: ${{ needs.prep.outputs.push_latest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: bash scripts/github-actions/publish-frontend-image.sh

  release-assets:
    name: Build release artifacts
    needs: [prep, build]
    if: ${{ github.ref_type == 'tag' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ASSET_DIR: ${{ runner.temp }}/portal-release-assets
      WEBSITE_CONTENT_REPOSITORY: ${{ vars.WEBSITE_CONTENT_REPOSITORY || 'https://github.com/haitaopanhq/knowledge.git' }}
      WEBSITE_CONTENT_REF: ${{ vars.WEBSITE_CONTENT_REF || 'main' }}
      WEBSITE_CONTENT_SUBDIR: ${{ vars.WEBSITE_CONTENT_SUBDIR || 'content/website' }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0

      - name: Set Up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build static dashboard artifact
        run: yarn build:static-dashboard

      - name: Build OpenNext Worker artifact
        run: yarn build:frontend-server:worker

      - name: Package frontend artifacts
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_ASSET_DIR}"
          artifact_suffix="${RELEASE_TAG//\//-}"

          tar -czf "${RELEASE_ASSET_DIR}/portal-static-dashboard-${artifact_suffix}.tar.gz" \
            -C static-dashboard/out .

          tar -czf "${RELEASE_ASSET_DIR}/portal-frontend-server-worker-${artifact_suffix}.tar.gz" \
            .open-next \
            open-next.config.ts \
            wrangler.worker.jsonc \
            package.json \
            yarn.lock

      - name: Upload release assets to workflow
        uses: actions/upload-artifact@v4
        with:
          name: portal-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/portal-release-assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release manifest and assets
    needs: [prep, build, release-assets]
    if: ${{ github.ref_type == 'tag' && needs.build.result == 'success' && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend release assets
        uses: actions/download-artifact@v4
        with:
          name: portal-release-assets-${{ github.sha }}
          path: release-assets

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_INPUT_DIRS: release-assets
          IMAGE_REFS: |
            ghcr.io/${{ needs.prep.outputs.ghcr_namespace }}/console:${{ needs.prep.outputs.image_tag }}
            ghcr.io/${{ needs.prep.outputs.ghcr_namespace }}/console-static-dashboard:${{ needs.prep.outputs.image_tag }}
            ghcr.io/${{ needs.prep.outputs.ghcr_namespace }}/console-frontend-server:${{ needs.prep.outputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release-artifacts.sh
