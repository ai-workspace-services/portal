name: Console-only UAT Pipeline
run-name: Console UAT / ${{ inputs.release_tag }}

# owner: ai-workspace-services/portal; caller: manual dispatch on protected main.
# Side effects: existing frontend-ssr-console-uat code + Worker-owned assets only.
# No Toolkit orchestration, Pages, router, DNS, database, or PROD deployment.
# Prerequisite (managed outside Portal): dedicated Vault JWT role
# github-actions-console-uat-deploy, exact job_workflow_ref for this file@main,
# repository=ai-workspace-services/portal, ref=refs/heads/main; policy grants
# read ONLY kv/data/uat/serverless/cloudflare. Never fall back to shared CICD.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Portal daily-build tag merged into main
        required: true
        type: string
      expected_sha:
        description: Expected full 40-character Portal commit SHA for the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portal-console-only-uat
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ai-workspace-services/portal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      # Fixed, reviewed GitOps configuration; changing this requires a PR.
      GITOPS_SHA: b1a96c7cdd5cd3aa44506ce5355d006e5d766849
      PORTAL_DEPLOYMENT_ENV: uat
      RUNTIME_ENV: uat
      PORTAL_INCREMENTAL_CACHE: none
      NEXT_PUBLIC_STATIC_CDN_URL: ''
      ACCOUNT_SERVICE_URL: https://accounts-serverless-uat.onwalk.net
      REQUIRE_EXTERNAL_WEBSITE_CONTENT: 'true'
      WEBSITE_CONTENT_REPOSITORY: https://github.com/ai-workspace-services/knowledge.git
      WEBSITE_CONTENT_REF: 825d7bd058fd197f8703cbc899b7d664b6800ec2
      WEBSITE_CONTENT_SUBDIR: content/website
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag SHA and main ancestry
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(uat-)?daily-build-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-r[1-9][0-9]*)?$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Resolve via GitHub as well as local git; fetch-depth=0 includes tags.
          main_sha=$(gh api repos/ai-workspace-services/portal/commits/main --jq .sha)
          tag_sha=$(gh api "repos/ai-workspace-services/portal/commits/$RELEASE_TAG" --jq .sha)
          [[ "$tag_sha" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$EXPECTED_SHA" ]]
          git cat-file -e "$main_sha^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SHA" "$main_sha"
          printf 'sha=%s\n' "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout verified release
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Checkout fixed GitOps configuration
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: ai-workspace-infra/gitops
          ref: b1a96c7cdd5cd3aa44506ce5355d006e5d766849
          path: .console-gitops
          persist-credentials: false
          sparse-checkout: topology/uat/serverless

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Validate UAT target and prepare GitOps config
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C .console-gitops rev-parse HEAD)" == "$GITOPS_SHA" ]]
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import yaml from 'js-yaml';
          const config = yaml.load(fs.readFileSync('.console-gitops/topology/uat/serverless/runtime-topology.yaml', 'utf8'));
          const fail = () => { throw new Error('Unexpected UAT console topology'); };
          const spec = config?.spec;
          const consoleBoundary = spec?.serverless?.ssr?.filter(x => x.id === 'console');
          if (config?.kind !== 'EdgeRoutingConfig' || config.metadata?.environment !== 'uat' ||
              spec?.runtime?.mode !== 'serverless' || spec?.serverless?.console_host !== 'console-serverless-uat.onwalk.net' ||
              spec?.serverless?.accounts_host !== 'accounts-serverless-uat.onwalk.net' ||
              consoleBoundary?.length !== 1 || consoleBoundary[0].worker_name !== 'frontend-ssr-console-uat') fail();
          const routes = consoleBoundary[0].route_suffixes;
          if (!Array.isArray(routes) || routes.length !== 3 ||
              !['/panel*', '/dashboard*', '/_edge/console/*'].every(x => routes.includes(x))) fail();
          const output = `${process.env.RUNNER_TEMP}/console-uat-topology.json`;
          fs.writeFileSync(output, JSON.stringify(config), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_BOUNDARY_CONFIG=${output}\n`);
          NODE

      - name: Build console boundary from verified SHA
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_VERSION: ${{ steps.source.outputs.sha }}
        run: |
          node scripts/check-boundary-links.mjs
          node --test scripts/ssr-bff-boundaries.test.mjs
          yarn build:ssr:console

      - name: Verify complete console asset inventory before credentials
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root = '.edge-build/console';
          const target = `${root}/.open-next/assets`;
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const files = directory => fs.readdirSync(directory, { recursive: true }).filter(name => fs.statSync(path.join(directory, name)).isFile());
          const inventory = [];
          const verify = (sourceRoot, destinationRoot) => {
            for (const name of files(sourceRoot)) {
              const source = path.join(sourceRoot, name);
              const destination = path.join(destinationRoot, name);
              if (!fs.existsSync(destination) || digest(source) !== digest(destination)) throw new Error('Console asset inventory is incomplete');
              inventory.push({ path: path.relative(target, destination), sha256: digest(destination) });
            }
          };
          verify(`${root}/.next/static`, `${target}/_edge/console/_next/static`);
          verify(`${root}/public`, target);
          if (!inventory.some(x => x.path.endsWith('.js')) || !inventory.some(x => x.path.endsWith('.css'))) throw new Error('Console client assets missing');
          const buildId = fs.readFileSync(`${root}/.next/BUILD_ID`, 'utf8').trim();
          if (buildId !== `console-${process.env.EXPECTED_SHA.slice(0, 16)}` ||
              fs.readFileSync(`${target}/BUILD_ID`, 'utf8').trim() !== buildId) throw new Error('Asset build identity mismatch');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/console-uat-assets.json`, JSON.stringify({ buildId, files: inventory }));
          console.log(`Complete console asset inventory verified (${inventory.length} files).`);
          NODE

      - name: Recheck remote tag and main before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api "repos/ai-workspace-services/portal/commits/$RELEASE_TAG" --jq .sha)" == "$EXPECTED_SHA" ]]
          gh api "repos/ai-workspace-services/portal/compare/$EXPECTED_SHA...main" --jq .status | \
            node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{if(!["ahead","identical"].includes(s.trim()))process.exit(1)})'

      - name: Read only UAT Cloudflare deployment credentials
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-console-uat-deploy
          jwtGithubAudience: vault
          exportEnv: false
          exportToken: false
          secrets: |
            kv/data/uat/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/uat/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Preserve existing console configuration and deploy Worker assets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Capture provider/CLI output privately: no bindings, values, or raw logs
          # are printed or uploaded. All remote writes happen inside deploy:ssr.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const worker = 'frontend-ssr-console-uat';
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}`;
          const privateDir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'console-uat-private-'));
          fs.chmodSync(privateDir, 0o700);
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          const fail = message => { throw new Error(message); };
          const api = async suffix => {
            const response = await fetch(`${base}${suffix}`, { headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) fail(`Console API read failed (${response.status})`);
            const body = await response.json();
            if (!body.success || !body.result) fail('Console API returned no usable result');
            return body.result;
          };
          const canonical = value => Array.isArray(value) ? value.map(canonical) :
            value && typeof value === 'object' ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
          const fingerprint = value => crypto.createHash('sha256').update(JSON.stringify(canonical(value))).digest('hex');
          const configPath = '.edge-build/console/wrangler.jsonc';
          try {
            if (!/^[0-9a-f]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID || '')) fail('Invalid UAT account identifier');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            if (config.name !== worker || config.main !== '.open-next/worker.js' ||
                config.assets?.directory !== '.open-next/assets' || config.assets?.binding !== 'ASSETS') fail('Unexpected generated Worker target');
            const settings = await api('/settings');
            const subdomain = await api('/subdomain');
            const beforeDeployments = await api('/deployments');
            if (beforeDeployments.deployments?.[0]?.versions?.length !== 1 ||
                beforeDeployments.deployments[0].versions[0].percentage !== 100) fail('Existing rollout is not a single stable version');
            if (!Array.isArray(settings.bindings) || !settings.compatibility_date ||
                typeof subdomain.enabled !== 'boolean' || typeof subdomain.previews_enabled !== 'boolean') fail('Existing Worker configuration is incomplete');
            const bindings = settings.bindings;
            if (new Set(bindings.map(x => x.name)).size !== bindings.length ||
                bindings.filter(x => x.type === 'assets').length !== 1 ||
                !bindings.some(x => x.name === 'ASSETS' && x.type === 'assets') ||
                !bindings.some(x => x.name === 'WORKER_SELF_REFERENCE' && x.type === 'service' && x.service === worker)) fail('Existing console bindings do not match target');
            if (bindings.some(x => x.name.startsWith('NEXT_INC_CACHE_'))) fail('Remote cache requires a separately reviewed cache-aware build');
            for (const [name, expected] of Object.entries({ RUNTIME_ENV: 'uat', ACCOUNT_SERVICE_URL: process.env.ACCOUNT_SERVICE_URL })) {
              if (!bindings.some(x => x.name === name && x.type === 'plain_text' && x.text === expected)) fail(`Existing ${name} does not match UAT`);
            }
            if (!(config.compatibility_flags || []).every(x => settings.compatibility_flags?.includes(x))) fail('Existing compatibility flags do not support this build');
            // Preserve every non-asset binding by name, including secret bindings;
            // strict inheritance is used by the pinned lockfile's Wrangler upload.
            // Values never enter the generated Wrangler config or artifact.
            delete config.vars;
            delete config.services;
            delete config.images;
            config.keep_vars = true;
            config.workers_dev = subdomain.enabled;
            config.preview_urls = subdomain.previews_enabled;
            config.compatibility_date = settings.compatibility_date;
            config.compatibility_flags = settings.compatibility_flags;
            for (const key of ['placement', 'limits', 'observability', 'logpush', 'tail_consumers', 'streaming_tail_consumers']) {
              if (settings[key] !== undefined) config[key] = settings[key];
            }
            if (settings.assets?.config) Object.assign(config.assets, settings.assets.config);
            config.unsafe = {
              bindings: bindings.filter(x => x.type !== 'assets').map(x => ({ name: x.name, type: 'inherit' })),
              metadata: {
                ...(settings.usage_model ? { usage_model: settings.usage_model } : {}),
                annotations: { ...(settings.annotations || {}), 'workers/tag': process.env.RELEASE_TAG, 'workers/message': `Portal console UAT ${process.env.EXPECTED_SHA}` },
              },
            };
            // No routes/custom domains are configured here: the existing router
            // service binding already selects this Worker, including /_edge/console.
            if ('routes' in config || 'route' in config || 'migrations' in config) fail('Broad deployment configuration rejected');
            fs.writeFileSync(configPath, JSON.stringify(config), { mode: 0o600 });
            const stableSettings = fingerprint(settings);
            if (fingerprint(await api('/settings')) !== stableSettings ||
                fingerprint(await api('/subdomain')) !== fingerprint(subdomain) ||
                fingerprint(await api('/deployments')) !== fingerprint(beforeDeployments)) fail('Worker configuration changed concurrently');
            const logPath = path.join(privateDir, 'deploy.log');
            const log = fs.openSync(logPath, 'wx', 0o600);
            let child;
            try {
              child = spawnSync('yarn', ['deploy:ssr', '--boundary', 'console'], {
                env: process.env, stdio: ['ignore', log, log], timeout: 600000,
              });
            } finally { fs.closeSync(log); }
            if (child.error || child.status !== 0) fail('Console Worker deployment failed; raw provider output withheld');
            const after = await api('/settings');
            const afterSubdomain = await api('/subdomain');
            const preserved = list => list.filter(x => x.type !== 'assets').sort((a, b) => a.name.localeCompare(b.name));
            if (fingerprint(preserved(after.bindings || [])) !== fingerprint(preserved(bindings)) ||
                fingerprint(afterSubdomain) !== fingerprint(subdomain)) fail('Post-deployment binding/subdomain verification failed');
            for (const key of ['compatibility_date', 'compatibility_flags', 'placement', 'limits', 'observability', 'logpush', 'tail_consumers', 'streaming_tail_consumers', 'usage_model', 'tags']) {
              if (fingerprint(after[key] ?? null) !== fingerprint(settings[key] ?? null)) fail(`Post-deployment ${key} verification failed`);
            }
            const deployments = await api('/deployments');
            const latest = deployments.deployments?.[0];
            if (!latest?.id || latest.versions?.length !== 1 || latest.versions[0].percentage !== 100) fail('Expected a single active Worker version');
            const versionId = latest.versions[0].version_id;
            const version = await api(`/versions/${versionId}`);
            if (version.annotations?.['workers/tag'] !== process.env.RELEASE_TAG ||
                version.annotations?.['workers/message'] !== `Portal console UAT ${process.env.EXPECTED_SHA}`) fail('Deployed Worker release identity mismatch');
            const assetsRoot = '.edge-build/console/.open-next/assets/_edge/console/_next';
            const assets = fs.readdirSync(assetsRoot, { recursive: true }).filter(x => /\.(js|css)$/.test(x));
            if (!assets.length) fail('Console build has no client assets');
            // Verify exact deployed bytes through the public router, not Pages.
            for (const relative of assets) {
              const response = await fetch(`https://console-serverless-uat.onwalk.net/_edge/console/_next/${relative}`, { redirect: 'manual', signal: AbortSignal.timeout(30000) });
              const bytes = Buffer.from(await response.arrayBuffer());
              if (response.status !== 200 || crypto.createHash('sha256').update(bytes).digest('hex') !==
                  crypto.createHash('sha256').update(fs.readFileSync(path.join(assetsRoot, relative))).digest('hex')) fail('Public console asset verification failed');
            }
            const response = await fetch('https://console-serverless-uat.onwalk.net/panel/operations/releases', { redirect: 'manual', signal: AbortSignal.timeout(30000) });
            const location = response.headers.get('location');
            if (![302, 303, 307, 308].includes(response.status) || !location ||
                new URL(location, response.url).origin !== 'https://console-serverless-uat.onwalk.net' ||
                new URL(location, response.url).pathname !== '/login') fail('Console authentication routing verification failed');
            const evidence = { environment: 'uat', worker, tag: process.env.RELEASE_TAG,
              sourceSha: process.env.EXPECTED_SHA, gitopsSha: process.env.GITOPS_SHA,
              websiteContentSha: process.env.WEBSITE_CONTENT_REF,
              assetInventorySha256: crypto.createHash('sha256').update(fs.readFileSync(`${process.env.RUNNER_TEMP}/console-uat-assets.json`)).digest('hex'),
              deploymentId: latest.id, versionId, assetsVerified: assets.length,
              bindingVerification: 'passed', anonymousLoginGate: 'passed', authenticatedAcceptance: 'not_verified' };
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/console-uat-release.json`, JSON.stringify(evidence, null, 2));
            console.log('Console Worker, preserved configuration and public assets verified; authenticated acceptance remains pending.');
          } catch (error) {
            // Errors are ours only; fetch/parser/subprocess errors may contain
            // request or response details, so never emit their raw messages.
            console.error('Console-only UAT deployment/verification failed. No raw logs or bindings published.');
            process.exitCode = 1;
          } finally {
            fs.rmSync(privateDir, { recursive: true, force: true });
          }
          NODE

      - name: Publish allowlisted release receipt
        uses: actions/upload-artifact@v4
        with:
          name: console-uat-release
          path: |
            ${{ runner.temp }}/console-uat-release.json
            ${{ runner.temp }}/console-uat-assets.json
          if-no-files-found: error
          retention-days: 14

      - name: Release summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/console-uat-release.json`, 'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Console-only UAT: ${receipt.tag}\n\nSource: ${receipt.sourceSha}\n\nWorker version: ${receipt.versionId}\n\nPublic assets and login gate passed. Authenticated functional acceptance: pending.\n`);
          NODE
